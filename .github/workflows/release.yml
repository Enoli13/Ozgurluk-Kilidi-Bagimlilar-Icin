name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - ".github/release-notes.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Sürümü belirle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=OzgurlukKilidi-BagimlilarIcin-$TAG.apk" >> "$GITHUB_ENV"

      - name: Kontrol derlemesi (imzasız)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintVitalRelease
